name: PR title

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

jobs:
  title:
    name: Check PR title format
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Match P<phase>.<task>, S<n>, Fix, Docs, Chore, Deps or Release
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          if ! printf '%s' "$TITLE" | grep -Eq '^(P[0-9]\.[0-9]+|S[0-9]+|Docs|Chore|Fix|Deps|Release): .+'; then
            echo "PR title must look like 'P1.2: summary' (see CONTRIBUTING.md); got: $TITLE" >&2
            exit 1
          fi
