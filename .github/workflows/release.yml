name: Release

# A vX.Y.Z tag that matches package.json creates a GitHub Release.
# Only a major release (vX.0.0, X >= 1) deploys, and only after approval
# in the protected `production` environment.

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      major: ${{ steps.version.outputs.major }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check tag matches package.json
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          pkg="v$(node -p 'require("./package.json").version')"
          if [ "$TAG" != "$pkg" ]; then
            echo "Tag $TAG does not match package.json version $pkg" >&2
            exit 1
          fi
          if printf '%s' "$TAG" | grep -Eq '^v[1-9][0-9]*\.0\.0$'; then echo "major=true" >> "$GITHUB_OUTPUT"; else echo "major=false" >> "$GITHUB_OUTPUT"; fi
          if printf '%s' "$TAG" | grep -Eq '^v0\.'; then echo "prerelease=true" >> "$GITHUB_OUTPUT"; else echo "prerelease=false" >> "$GITHUB_OUTPUT"; fi
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: pnpm install --frozen-lockfile
      - run: pnpm run --if-present lint
      - run: pnpm typecheck
      - run: pnpm run --if-present test
      - run: pnpm check:kit
      - run: pnpm build
      - run: pnpm scan:dist

  release:
    name: GitHub Release
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Create release with generated notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
        run: |
          flags="--generate-notes --verify-tag"
          if [ "$PRERELEASE" = "true" ]; then flags="$flags --prerelease"; fi
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" $flags

  deploy:
    name: Deploy to production
    needs: [verify, release]
    if: needs.verify.outputs.major == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require a Worker config
        run: |
          if [ ! -f wrangler.jsonc ]; then
            echo "wrangler.jsonc not found; nothing to deploy yet." >&2
            exit 1
          fi
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy
